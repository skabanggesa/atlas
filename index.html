<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4 font-sans">

  <!-- ================= SKRIN 1: LOG MASUK ================= -->
  <div id="login-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 hidden">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">⚡ ATLAS SCANNER</h1>
      <p class="text-slate-400 text-sm mt-1">Sila daftarkan telefon ini sekali sahaja</p>
    </div>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Pilih Nama Guru:</label>
        <select id="select-guru" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-white focus:outline-none focus:border-blue-500">
          <option value="">-- Memuat naik senarai... --</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">PIN Keselamatan (4 Angka):</label>
        <input type="password" id="input-pin" maxlength="4" placeholder="••••" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-center text-xl tracking-widest text-white focus:outline-none focus:border-blue-500">
      </div>
      
      <button onclick="logMasuk()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30">
        Simpan & Masuk
      </button>
    </div>
  </div>

  <!-- ================= SKRIN 2: DASHBOARD PENGIMBAS ================= -->
  <div id="app-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 hidden">
    <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-4">
      <div>
        <div class="flex items-center gap-2">
          <p class="text-xs text-slate-400">Selamat Kembali,</p>
          <span id="badge-peranan" class="hidden text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">ADMIN</span>
        </div>
        <h2 id="paparan-nama" class="text-lg font-bold text-emerald-400">Cikgu...</h2>
      </div>
      <button onclick="tukarGuru()" class="text-xs text-slate-400 hover:text-red-400 underline">Tukar Guru</button>
    </div>

    <button id="btn-admin-panel" onclick="bukaLiveData()" class="hidden w-full mb-4 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-bold py-3 px-4 rounded-xl text-sm transition duration-200 shadow-lg flex items-center justify-center gap-2 border border-amber-500/30">
      <span>📊 RADAR KEBERADAAN GURU (LIVE)</span>
    </button>

    <div id="butang-tindakan" class="grid grid-cols-2 gap-4 mb-2">
      <button onclick="mulaImbas('MASUK')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-6 rounded-2xl text-lg transition duration-200 shadow-lg shadow-emerald-600/30 flex flex-col items-center justify-center gap-1">
        <span>🟢 MASUK</span>
        <span class="text-xs font-normal opacity-80">Imbas Masuk Kelas</span>
      </button>
      <button onclick="mulaImbas('KELUAR')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-6 rounded-2xl text-lg transition duration-200 shadow-lg shadow-rose-600/30 flex flex-col items-center justify-center gap-1">
        <span>🔴 KELUAR</span>
        <span class="text-xs font-normal opacity-80">Imbas Keluar Kelas</span>
      </button>
    </div>

    <!-- Kotak Pengimbas Kamera Live Stream -->
    <div id="scanner-container" class="hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <span id="label-status-scan" class="font-bold text-sm px-3 py-1 rounded-full bg-blue-900/50 text-blue-300 border border-blue-500/30"></span>
        <button onclick="tutupImbas()" class="text-sm text-rose-400 hover:text-rose-300 font-semibold">✕ Batal</button>
      </div>
      <div id="reader" class="w-full bg-black rounded-xl overflow-hidden border-2 border-slate-600"></div>
    </div>
  </div>

  <!-- ================= SKRIN 3: PANEL ADMIN ================= -->
  <div id="admin-screen" class="w-full max-w-2xl bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 hidden flex flex-col max-h-[90vh]">
    <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-4">
      <div>
        <h2 class="text-lg font-bold text-amber-400">📊 Radar Keberadaan (Hari Ini)</h2>
        <p id="label-masa-kemaskini" class="text-xs text-slate-400">Memuat naik data...</p>
      </div>
      <button onclick="tutupLiveData()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg font-semibold text-slate-300">Kembali</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Saring Guru:</label>
        <select id="filter-guru" onchange="saringDanPaparData()" class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-xs text-white focus:outline-none focus:border-amber-500">
          <option value="">Semua Guru</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Saring Kelas:</label>
        <select id="filter-kelas" onchange="saringDanPaparData()" class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-xs text-white focus:outline-none focus:border-amber-500">
          <option value="">Semua Kelas</option>
        </select>
      </div>
    </div>

    <div class="overflow-y-auto flex-1 border border-slate-700 rounded-xl">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="bg-slate-900/80 text-slate-400 border-b border-slate-700 sticky top-0">
            <th class="p-3">Masa</th>
            <th class="p-3">Status</th>
            <th class="p-3">Nama Guru</th>
            <th class="p-3">Kelas</th>
          </tr>
        </thead>
        <tbody id="jadual-live-body" class="divide-y divide-slate-700/50">
          <tr><td colSpan="4" class="p-6 text-center text-slate-500">Memuat naik rekod hari ini...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div id="toast" class="fixed bottom-6 bg-emerald-500 text-slate-950 font-bold px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 flex items-center gap-3 z-50">
    <span class="text-2xl">✅</span>
    <div>
      <p id="toast-title" class="text-sm">IMBASAN BERJAYA!</p>
      <p id="toast-desc" class="text-xs font-normal">Rekod telah disimpan ke dalam sistem.</p>
    </div>
  </div>

  <script>
    // ⚠️ TAMPAL WEB APP URL DARIPADA GOOGLE APPS SCRIPT DI SINI:
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-p-SoAAgkEgFvHdm0rEVR1YTEAdd-86xNnwqOigL4lww1Lm1QbVC_YXeV6YVhFb-o8A/exec";

    let senaraiGuruGlobal = [];
    let dataLiveGlobal = [];
    let statusSemasa = "";
    let html5QrcodeScanner = null;

    window.onload = function() {
      const savedGuru = localStorage.getItem('atlas_guru');
      if (savedGuru) {
        setupPaparanGuru(JSON.parse(savedGuru));
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        fetch(`${GAS_WEB_APP_URL}?action=getSenaraiGuru`)
          .then(res => res.json())
          .then(data => isiDropdownGuru(data));
      }
    };

    function isiDropdownGuru(data) {
      senaraiGuruGlobal = data;
      const select = document.getElementById('select-guru');
      select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
      data.forEach((g, index) => {
        select.innerHTML += `<option value="${index}">${g.nama}</option>`;
      });
    }

    function logMasuk() {
      const index = document.getElementById('select-guru').value;
      const pin = document.getElementById('input-pin').value;
      if (index === "" || pin === "") { alert("Sila lengkapkan maklumat!"); return; }

      const guruPilihan = senaraiGuruGlobal[index];
      if (guruPilihan.pin === pin) {
        localStorage.setItem('atlas_guru', JSON.stringify(guruPilihan));
        setupPaparanGuru(guruPilihan);
        document.getElementById('login-screen').classList.add('hidden');
      } else {
        alert("PIN Tidak Tepat!");
      }
    }

    function setupPaparanGuru(guru) {
      document.getElementById('paparan-nama').innerText = guru.nama;
      document.getElementById('app-screen').classList.remove('hidden');
      if (guru.peranan && guru.peranan.toUpperCase() === "ADMIN") {
        document.getElementById('btn-admin-panel').classList.remove('hidden');
        document.getElementById('badge-peranan').classList.remove('hidden');
      }
    }

    function tukarGuru() {
      if(confirm("Log keluar?")) {
        localStorage.removeItem('atlas_guru');
        location.reload();
      }
    }

    // 📸 Kamera Live Stream Berfungsi 100% di GitHub Pages!
    function mulaImbas(status) {
      statusSemasa = status;
      document.getElementById('butang-tindakan').classList.add('hidden');
      document.getElementById('scanner-container').classList.remove('hidden');
      
      const label = document.getElementById('label-status-scan');
      label.innerText = `IMBAS ${status}`;
      label.className = status === 'MASUK' 
        ? 'font-bold text-sm px-3 py-1 rounded-full bg-emerald-900/50 text-emerald-300 border border-emerald-500/30'
        : 'font-bold text-sm px-3 py-1 rounded-full bg-rose-900/50 text-rose-300 border border-rose-500/30';

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        alert("Sila benarkan kebenaran kamera pada pelayar anda!");
        tutupImbas();
      });
    }

    function tutupImbas() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => html5QrcodeScanner.clear()).catch(err => console.log(err));
      }
      document.getElementById('scanner-container').classList.add('hidden');
      document.getElementById('butang-tindakan').classList.remove('hidden');
    }

function onScanSuccess(decodedText) {
  mainkanBunyiBeep();
      tutupImbas();
      const guru = JSON.parse(localStorage.getItem('atlas_guru'));
      const payload = {
        nama: guru.nama,
        emel: guru.emel,
        status: statusSemasa,
        kodKelas: decodedText
      };

      paparToast("⌛ MEMPROSES...", "Menyemak status keberadaan...");

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          // Jika Berjaya atau Auto-Checkout
          paparToast("BERJAYA!", response.message);
        } else {
          // Jika Ditolak Sistem (Imbasan Bertindih / Belum Masuk)
          alert(response.message);
        }
      })
      .catch(err => {
        alert("Ralat sambungan. Sila cuba lagi.");
      });
    }
    function onScanFailure(error) {}

    function bukaLiveData() {
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('admin-screen').classList.remove('hidden');
      fetch(`${GAS_WEB_APP_URL}?action=getLiveDataHariIni`)
        .then(res => res.json())
        .then(data => prosesDataLive(data));
    }

    function tutupLiveData() {
      document.getElementById('admin-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
    }

    function prosesDataLive(data) {
      dataLiveGlobal = data;
      document.getElementById('label-masa-kemaskini').innerText = `Dikemas kini pada: ${new Date().toLocaleTimeString('ms-MY')}`;
      
      const senaraiGuruUnique = [...new Set(data.map(item => item.nama))].sort();
      const senaraiKelasUnique = [...new Set(data.map(item => item.kelas))].sort();
      
      const selectGuru = document.getElementById('filter-guru');
      const selectKelas = document.getElementById('filter-kelas');
      
      selectGuru.innerHTML = '<option value="">Semua Guru</option>';
      senaraiGuruUnique.forEach(g => selectGuru.innerHTML += `<option value="${g}">${g}</option>`);
      
      selectKelas.innerHTML = '<option value="">Semua Kelas</option>';
      senaraiKelasUnique.forEach(k => selectKelas.innerHTML += `<option value="${k}">${k}</option>`);

      saringDanPaparData();
    }

    function saringDanPaparData() {
      const penapisGuru = document.getElementById('filter-guru').value;
      const penapisKelas = document.getElementById('filter-kelas').value;
      
      let dataSaringan = dataLiveGlobal.filter(item => {
        return (penapisGuru === "" || item.nama === penapisGuru) && (penapisKelas === "" || item.kelas === penapisKelas);
      });

      dataSaringan.sort((a, b) => {
        if (a.kelas.toLowerCase() < b.kelas.toLowerCase()) return -1;
        if (a.kelas.toLowerCase() > b.kelas.toLowerCase()) return 1;
        if (a.masa < b.masa) return -1;
        if (a.masa > b.masa) return 1;
        return 0;
      });

      const tbody = document.getElementById('jadual-live-body');
      tbody.innerHTML = "";

      if (dataSaringan.length === 0) {
        tbody.innerHTML = '<tr><td colSpan="4" class="p-6 text-center text-slate-500">Tiada rekod keberadaan dijumpai.</td></tr>';
        return;
      }

      dataSaringan.forEach(row => {
        const badgeStatus = row.status === 'MASUK'
          ? '<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">MASUK</span>'
          : '<span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full font-bold">KELUAR</span>';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition duration-150">
            <td class="p-3 font-mono text-slate-300">${row.masa}</td>
            <td class="p-3">${badgeStatus}</td>
            <td class="p-3 font-medium text-white">${row.nama}</td>
            <td class="p-3 text-amber-300 font-semibold">${row.kelas}</td>
          </tr>
        `;
      });
    }

    function paparToast(tajuk, deskripsi) {
      document.getElementById('toast-title').innerText = tajuk;
      document.getElementById('toast-desc').innerText = deskripsi;
      const toast = document.getElementById('toast');
      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }

    // 🔊 Fungsi Penjana Bunyi Beep (Web Audio API)
    function mainkanBunyiBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine'; // Jenis gelombang bunyi
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Frekuensi bunyi (800Hz - rangup!)
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Kelantangan (Volume 10%)

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.12); // Durasi bunyi (0.12 saat)
      } catch (e) {
        console.log("Audio tidak disokong atau disekat", e);
      }
    }
  </script>
</body>
</html>
